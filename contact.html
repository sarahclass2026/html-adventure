<main>
    <h1>Contact Me</h1>
    <p>If you would like to get in touch with me, please fill out the form below.</p>

    <form>
        <label>
            Name:<br>
            <input type="text" name="name" required>
        </label><br><br>

        <label>
            Email:<br>
            <input type="email" name="email" required>
        </label><br><br>

        <label>
            Message:<br>
            <textarea name="message" rows="5" required></textarea>
        </label><br><br>

        <p>Gender:</p>
        <label><input type="radio" name="gender" required> Female</label><br>
        <label><input type="radio" name="gender"> Male</label><br><br>

        <p>Interests:</p>
        <label><input type="checkbox" name="interest" required> Coding</label><br>
        <label><input type="checkbox" name="interest"> Design</label><br>
        <label><input type="checkbox" name="interest"> Music</label><br><br>

        <button type="submit">Send Message</button>
    </form>

    <p>Or contact me directly by email: <a href="mailto:sarahnoorizada@gmail.com">Email Me</a></p>
